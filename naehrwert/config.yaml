name: Nährwert-Service
version: "0.7.3"
slug: naehrwert
description: Ernährungstagebuch, Rezepte und Tagesbilanzen auf Basis BLS 4.0 – mit Sensoren und Schnelleingabe in Home Assistant
url: https://github.com/geokoch/ha-addons/tree/main/naehrwert
arch:
  - amd64
  - aarch64
# Privates Image: in Home Assistant einmalig eine Registry für ghcr.io hinterlegen (siehe DOCS.md)
image: ghcr.io/geokoch/naehrwert
init: false
startup: application
boot: auto
services:
  - mqtt:need
map:
  - app_config:rw
# API und /mcp (mit Token) über einen Port – Ingress würde externe Clients aussperren.
# Port 8081 (MCP ohne Token für Home Assistant) ist absichtlich NICHT gemappt.
# Ingress (Port 8082): Seitenleiste „Nährwert“ mit Web-UI und PDF-Reports, Anmeldung über HA.
ingress: true
ingress_port: 8082
panel_icon: mdi:food-apple-outline
panel_title: Nährwert
ports:
  8080/tcp: 8099
ports_description:
  8080/tcp: REST-API, Swagger-UI und MCP (Bearer-Token)
watchdog: http://[HOST]:[PORT:8080]/actuator/health
# SQLite konsistent sichern: Add-on wird für das Backup kurz angehalten
backup: cold
backup_exclude:
  - "backup/*"
options:
  api_token: ""
  log_level: info
  heap_mb: 160
schema:
  api_token: password
  log_level: list(trace|debug|info|warn|error)
  heap_mb: int(64,1024)
